<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Comet Dodge — a tiny game built from one prompt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #050514; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 0; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 14px 18px; color: #fff;
    font-weight: 700; font-size: 18px; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    pointer-events: none; user-select: none; }
  .hud .hearts { color: #ff5d73; letter-spacing: 2px; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; background: rgba(5,5,20,.55); backdrop-filter: blur(2px); }
  .overlay h1 { font-size: 52px; letter-spacing: 2px; margin-bottom: 8px;
    background: linear-gradient(90deg, #ffd166, #ff5d73, #7b5cff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { font-size: 17px; line-height: 1.6; color: #cfd2ff; max-width: 420px; }
  .overlay .keys { margin-top: 10px; font-size: 14px; color: #9aa0d0; }
  .overlay button { margin-top: 22px; padding: 14px 34px; font-size: 19px; font-weight: 800;
    color: #14082e; background: linear-gradient(90deg, #ffd166, #ff8a5c);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(255, 160, 90, .45); }
  .overlay button:hover { transform: scale(1.05); }
  .overlay button:active { transform: scale(.97); }
  .hidden { display: none !important; }
  #flash { position: absolute; inset: 0; background: rgba(255,60,80,.28);
    pointer-events: none; opacity: 0; }
  @media (max-width: 600px) { .overlay h1 { font-size: 36px; } .hud { font-size: 15px; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div class="hud">
    <span id="score">SCORE 0</span>
    <span id="time">60</span>
    <span class="hearts" id="lives">♥♥♥</span>
  </div>
  <div class="overlay" id="startScreen">
    <h1>COMET DODGE</h1>
    <p>Dodge the comets. Grab the glowing orbs.<br>
    You have <b>60 seconds</b> and <b>3 lives</b>. How high can you score?</p>
    <p class="keys">← → or A / D to steer &nbsp;·&nbsp; drag on touch</p>
    <button id="startBtn">LAUNCH 🚀</button>
  </div>
  <div class="overlay hidden" id="endScreen">
    <h1 id="endTitle">TIME UP!</h1>
    <p id="endScore">Score: 0</p>
    <p id="bestScore"></p>
    <button id="againBtn">PLAY AGAIN</button>
  </div>
</div>
<script>
"use strict";
/* Comet Dodge — built from one prompt. Vanilla JS, no dependencies. */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = () => canvas.width, H = () => canvas.height;
function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const GAME_TIME = 60;
const state = {
  mode: "start",           // start | playing | over
  score: 0, lives: 3, timeLeft: GAME_TIME,
  rocket: { x: window.innerWidth / 2, y: 0, w: 46, h: 54, vx: 0 },
  comets: [], orbs: [], stars: [], parts: [],
  spawnT: 0, orbT: 0, elapsed: 0, invuln: 0, shake: 0, nearMiss: new Set(),
};
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  if (e.key === "Enter" && state.mode !== "playing") startGame();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });
let dragging = false;
canvas.addEventListener("pointerdown", e => { dragging = true; moveRocket(e.clientX); });
canvas.addEventListener("pointermove", e => { if (dragging) moveRocket(e.clientX); });
canvas.addEventListener("pointerup", () => { dragging = false; });
function moveRocket(x) {
  state.rocket.x = Math.max(30, Math.min(window.innerWidth - 30, x));
}
function initStars() {
  state.stars = [];
  for (let i = 0; i < 120; i++) state.stars.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.6 + 0.4,
    tw: Math.random() * Math.PI * 2,
  });
}
initStars();

function spawnComet() {
  const speed = 160 + state.elapsed * 4 + Math.random() * 120;
  state.comets.push({
    x: 30 + Math.random() * (window.innerWidth - 60),
    y: -30, r: 12 + Math.random() * 14,
    vy: speed, vx: (Math.random() - 0.5) * 40,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 2,
  });
}
function spawnOrb() {
  state.orbs.push({
    x: 30 + Math.random() * (window.innerWidth - 60),
    y: -20, r: 11, vy: 130 + Math.random() * 60, pulse: Math.random() * 6,
  });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, color, r: 2 + Math.random() * 3 });
  }
}
function flash() {
  const f = document.getElementById("flash");
  f.style.transition = "none"; f.style.opacity = "1";
  requestAnimationFrame(() => { f.style.transition = "opacity .45s"; f.style.opacity = "0"; });
}
function startGame() {
  state.mode = "playing"; state.score = 0; state.lives = 3;
  state.timeLeft = GAME_TIME; state.elapsed = 0;
  state.comets = []; state.orbs = []; state.parts = [];
  state.invuln = 0; state.shake = 0; state.nearMiss = new Set();
  state.rocket.x = window.innerWidth / 2;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
}
function endGame(title) {
  state.mode = "over";
  const best = Math.max(state.score, +(localStorage.getItem("cometDodgeBest") || 0));
  localStorage.setItem("cometDodgeBest", best);
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endScore").textContent = "Score: " + state.score;
  document.getElementById("bestScore").textContent = "Best: " + best +
    (state.score >= best && state.score > 0 ? "  ·  New best! 🏆" : "");
  document.getElementById("endScreen").classList.remove("hidden");
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);

function update(dt) {
  const r = state.rocket;
  r.y = window.innerHeight - 110;
  const speed = 520;
  if (keys.ArrowLeft || keys.a || keys.A) r.x -= speed * dt;
  if (keys.ArrowRight || keys.d || keys.D) r.x += speed * dt;
  r.x = Math.max(28, Math.min(window.innerWidth - 28, r.x));

  state.elapsed += dt;
  state.timeLeft = Math.max(0, GAME_TIME - state.elapsed);
  if (state.timeLeft <= 0) { endGame("TIME UP!"); return; }
  if (state.invuln > 0) state.invuln -= dt;
  if (state.shake > 0) state.shake -= dt;

  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnComet();
    state.spawnT = Math.max(0.22, 0.62 - state.elapsed * 0.006);
    if (Math.random() < 0.25) spawnComet();
  }
  state.orbT -= dt;
  if (state.orbT <= 0) { spawnOrb(); state.orbT = 1.1 + Math.random() * 1.4; }

  for (const c of state.comets) {
    c.y += c.vy * dt; c.x += c.vx * dt; c.rot += c.vr * dt;
    // near-miss bonus: comet passes close by without hitting
    const d = Math.hypot(c.x - r.x, c.y - r.y);
    if (d < 70 && d >= c.r + 26 && !state.nearMiss.has(c) && c.y > r.y) {
      state.nearMiss.add(c); state.score += 2;
    }
    if (d < c.r + 24 && state.invuln <= 0) {
      state.lives--; state.invuln = 1.6; state.shake = 0.35;
      burst(r.x, r.y, "#ff5d73", 26); flash();
      if (state.lives <= 0) { endGame("GAME OVER"); return; }
    }
  }
  state.comets = state.comets.filter(c => c.y < window.innerHeight + 60);
  for (const o of state.orbs) {
    o.y += o.vy * dt; o.pulse += dt * 6;
    if (Math.hypot(o.x - r.x, o.y - r.y) < 34) {
      state.score += 10; burst(o.x, o.y, "#ffd166", 16);
      o.y = window.innerHeight + 99; // collected
    }
  }
  state.orbs = state.orbs.filter(o => o.y < window.innerHeight + 40);
  for (const p of state.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  state.parts = state.parts.filter(p => p.life > 0);

  document.getElementById("score").textContent = "SCORE " + state.score;
  document.getElementById("time").textContent = Math.ceil(state.timeLeft);
  document.getElementById("lives").textContent = "♥".repeat(Math.max(0, state.lives)) +
    "♡".repeat(Math.max(0, 3 - state.lives));
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
  g.addColorStop(0, "#070722"); g.addColorStop(0.6, "#120a33"); g.addColorStop(1, "#2a0f3d");
  ctx.fillStyle = g; ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  for (const s of state.stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(s.tw += 0.02));
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawRocket() {
  const r = state.rocket;
  ctx.save();
  if (state.invuln > 0 && Math.floor(performance.now() / 90) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.translate(r.x, r.y);
  // flame
  const fl = 16 + Math.random() * 14;
  ctx.fillStyle = "#ff9a3c";
  ctx.beginPath(); ctx.moveTo(-9, 26); ctx.lineTo(0, 26 + fl); ctx.lineTo(9, 26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffd166";
  ctx.beginPath(); ctx.moveTo(-5, 26); ctx.lineTo(0, 26 + fl * 0.6); ctx.lineTo(5, 26); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = "#e8ecff";
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.quadraticCurveTo(16, -8, 14, 18);
  ctx.lineTo(-14, 18); ctx.quadraticCurveTo(-16, -8, 0, -28); ctx.fill();
  ctx.fillStyle = "#7b5cff"; ctx.beginPath(); ctx.arc(0, -4, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#9fe8ff"; ctx.beginPath(); ctx.arc(0, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ff5d73";
  ctx.beginPath(); ctx.moveTo(-14, 10); ctx.lineTo(-24, 26); ctx.lineTo(-14, 24); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(24, 26); ctx.lineTo(14, 24); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
  drawBackground();
  for (const o of state.orbs) {
    const glow = 10 + Math.sin(o.pulse) * 4;
    ctx.save(); ctx.shadowColor = "#ffd166"; ctx.shadowBlur = glow;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff3c4";
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  for (const c of state.comets) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, c.r + 4);
    grad.addColorStop(0, "#ffb199"); grad.addColorStop(0.5, "#8a5a4a"); grad.addColorStop(1, "#4a2c22");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,120,90,.5)";
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.arc((Math.random() - 0.5) * c.r, (Math.random() - 0.5) * c.r, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // comet tail
    ctx.strokeStyle = "rgba(255,150,110,.55)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(c.x, c.y - c.r); ctx.lineTo(c.x - c.vx * 0.12, c.y - c.r - 34); ctx.stroke();
  }
  for (const p of state.parts) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (state.mode !== "start") drawRocket();
  ctx.restore();
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.mode === "playing") update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
